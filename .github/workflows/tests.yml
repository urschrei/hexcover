name: Build wheel, release and publish on new tag

on: [push, pull_request]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Test with pytest
      run: uv run --locked pytest

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools-scm reads the version from the tags

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.2

    - name: Build wheel and sdist
      run: uv build

    - uses: actions/upload-artifact@v7
      name: Upload wheel and sdist as artifact
      with:
        name: dist
        path: dist/

  release_artifacts:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    name: Release and publish tested wheel and sdist
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Download wheel and sdist
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: List downloaded files
      run: ls -l dist/

    - name: Create release and upload wheel and sdist
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        artifacts: "dist/*.whl,dist/*.tar.gz"
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: PyPI Publish
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        packages-dir: dist/
